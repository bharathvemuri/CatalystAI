[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "An agent-orchestration harness: agents decide, tools provide evidence, gates enforce deterministic outcomes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "ai_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_harness = ["core/**/*"]
